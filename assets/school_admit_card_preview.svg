  <text x="72" y="652" font-family="Arial, sans-serif" font-size="11" fill="#78350f">1. Candidate must carry this printed Admit Card along with valid School ID Card to the Examination Hall at least 30 minutes before start time.</text>
  <text x="72" y="669" font-family="Arial, sans-serif" font-size="11" fill="#78350f">2. Electronic gadgets, smartwatches, calculators, and written chits are strictly prohibited inside the examination room.</text>

